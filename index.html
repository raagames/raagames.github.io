<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Step into Raagame2 with Raahil. Enjoy free unblocked games and create your own account to unlock more!">
  <title>Welcome to Raagame2</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at center, #00C6FF, #005FFF);
      background-size: 400% 400%;
      animation: swirl 10s linear infinite;
      color: white;
      position: relative;
    }

    @keyframes swirl {
      0% { background-position: 0 0; }
      100% { background-position: 300% 300%; }
    }

    .button-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 50px;
    }

    .game-button, .auth-button {
      width: 200px;
      height: 50px;
      border: none;
      border-radius: 15px;
      font-family: Arial, sans-serif;
      font-size: 16px;
      cursor: pointer;
      text-align: center;
      transition: transform 0.3s, box-shadow 0.3s;
      color: white;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .game-button:hover, .auth-button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
    }

    .raagame3 { background: linear-gradient(to bottom right, #FF5733, #C70039); }
    .popit-master { background: linear-gradient(to bottom right, #33FF57, #28A745); }
    .minecraft { background: linear-gradient(to bottom right, #FFC300, #FF5733); }
    .survival-race { background: linear-gradient(to bottom right, #33C3FF, #0074D9); }
    .home-base { background: linear-gradient(to bottom right, #33C3FF, #0074D9); }

    .auth-button {
      background: linear-gradient(to bottom right, #FF851B, #FF4136);
    }

    #signup-overlay, #signin-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 10000;
      justify-content: center;
      align-items: center;
    }

    #signup-overlay div, #signin-overlay div {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      max-width: 300px;
    }

    input {
      padding: 8px;
      margin: 10px 0;
      font-size: 1rem;
      width: 90%;
    }

    button.overlay-button {
      padding: 8px 16px;
      font-size: 1rem;
      background-color: #FF851B;
      color: white;
      border: none;
      border-radius: 5px;
    }

    button.overlay-button:hover {
      background-color: #FF6309;
    }

    .bottom-right {
      position: absolute;
      bottom: 10px;
      right: 10px;
      width: 100px;
      height: auto;
    }
  </style>

  <script>
    function openWithGameEmbed(gameUrl, gameName) {
      const gameWindow = window.open("about:blank", "_blank", "width=800,height=600");
      if (gameWindow) {
        gameWindow.document.write(`
          <!DOCTYPE html>
          <html>
          <head>
            <title>${gameName}</title>
            <style>
              body {
                margin: 0;
                background: black;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
              }
              iframe {
                width: 100%;
                height: 100%;
                border: none;
              }
            </style>
          </head>
          <body>
            <iframe src="${gameUrl}" allowfullscreen></iframe>
          </body>
          </html>
        `);
      } else {
        alert("Popup blocked or failed to open.");
      }
    }

    function checkAccess(game, url) {
      const signedIn = localStorage.getItem("signedIn");
      if (signedIn === "true") {
        if (game === 'Minecraft') {
          window.open(url, "_blank", "width=800,height=600");
        } else {
          openWithGameEmbed(url, game);
        }
      } else {
        alert(`Please sign in to access ${game}.`);
        showSignInForm();
      }
    }

    function showSignUpForm() {
      document.getElementById('signup-overlay').style.display = "flex";
      document.body.style.overflow = "auto"; // Allow input focus
    }

    function showSignInForm() {
      document.getElementById('signin-overlay').style.display = "flex";
      document.body.style.overflow = "auto"; // Allow input focus
    }

    function hideOverlays() {
      document.getElementById('signup-overlay').style.display = "none";
      document.getElementById('signin-overlay').style.display = "none";
      document.body.style.overflow = "hidden"; // Restore overflow restriction
    }

    function createAccount() {
      const username = document.getElementById('signup-username').value.trim();
      const password = document.getElementById('signup-password').value;

      if (!username || !password) {
        alert("Please fill in all fields.");
        return;
      }

      const accounts = JSON.parse(localStorage.getItem('accounts') || "{}");
      if (accounts[username]) {
        alert("Username already exists. Please choose another.");
        return;
      }

      accounts[username] = { password };
      localStorage.setItem("accounts", JSON.stringify(accounts));
      alert("Account created successfully!");
      hideOverlays();
    }

    function signIn() {
      const username = document.getElementById('signin-username').value.trim();
      const password = document.getElementById('signin-password').value;

      const accounts = JSON.parse(localStorage.getItem('accounts') || "{}");
      if (accounts[username] && accounts[username].password === password) {
        alert("Sign In successful!");
        localStorage.setItem("signedIn", "true");
        hideOverlays();
      } else {
        alert("Incorrect username or password.");
      }
    }
  </script>
</head>
<body>
  <div>
    <h1>Welcome to Raagame2!</h1>
    <div class="button-container">
      <button class="game-button raagame3" onclick="checkAccess('Raagame3', 'https://www.kogama.com/')">Play Raagame3</button>
      <button class="game-button popit-master" onclick="checkAccess('Pop It Master', 'https://raagames.github.io/popit/index.html')">Play Pop It Master</button>
      <button class="game-button minecraft" onclick="checkAccess('Minecraft', 'https://raagames.github.io/games/minecraft.html')">Play Minecraft</button>
      <button class="game-button survival-race" onclick="checkAccess('Survival Race', 'https://www.survivalrace.net')">Play Survival Race</button>
      <button class="auth-button" onclick="showSignUpForm()">Sign Up</button>
      <button class="auth-button" onclick="showSignInForm()">Sign In</button>
    </div>
  </div>

  <div id="signup-overlay">
    <div>
      <h2>Create a New Account</h2>
      <input id="signup-username" type="text" placeholder="Choose Username">
      <input id="signup-password" type="password" placeholder="Choose Password">
      <button class="overlay-button" onclick="createAccount()">Create Account</button>
      <button class="overlay-button" onclick="hideOverlays()">Close</button>
    </div>
  </div>

  <div id="signin-overlay">
    <div>
      <h2>Sign In</h2>
      <input id="signin-username" type="text" placeholder="Username">
      <input id="signin-password" type="password" placeholder="Password">
      <button class="overlay-button" onclick="signIn()">Sign In</button>
      <button class="overlay-button" onclick="hideOverlays()">Close</button>
    </div>
  </div>

  <!-- Additional Info Section -->
  <div id="cu">
    <div>
      <h2>Info</h2>
      <h1>This is a game with all of the scholastic characters. Including Dog Man! Be patient when it is loading, it might take time. It is called home base.</h1>
      <button class="game-button home-base" onclick="checkAccess('games', 'https://raagames.github.io/games/homeb.html')">Play Home Base</button>
    </div>
  </div>

  <img src="https://raagames.github.io/raagames.png" class="bottom-right" alt="Raagames Logo">
</body>
</html>
